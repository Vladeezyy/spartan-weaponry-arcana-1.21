plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Spartan Weaponry (required) and the config API it needs
    modImplementation files("${rootDir}/libs/spartanweaponry-fabric-${spartanweaponry_version}.jar")
    modLocalRuntime "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    // 1.21.11: no Botania (no 1.21.11 version), so no compat/botania
    modLocalRuntime "maven.modrinth:modmenu:17.0.1"
    // Popular client / performance mods for compatibility runs (-Pwith_compat)
    if (project.hasProperty('with_compat')) {
        modLocalRuntime "maven.modrinth:sodium:${compat_fabric_sodium}"
        modLocalRuntime "maven.modrinth:iris:${compat_fabric_iris}"
        // Iris' own libraries: Loom does not load the jars inside dev mods (Iris 1.8.8 for Fabric)
        modLocalRuntime 'org.anarres:jcpp:1.4.14'
        modLocalRuntime 'org.antlr:antlr4-runtime:4.13.1'
        modLocalRuntime 'io.github.douira:glsl-transformer:3.0.0-pre3'
        modLocalRuntime "maven.modrinth:lithium:${compat_fabric_lithium}"
        modLocalRuntime "maven.modrinth:ferrite-core:${compat_fabric_ferritecore}"
        modLocalRuntime "maven.modrinth:jade:${compat_fabric_jade}"
    }
}

loom {
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        scene {
            client()
            name 'Scene'
            vmArg '-Dspartanweaponryarcana.scene=true'
            vmArg "-Dspartanweaponryarcana.scene.lang=${project.findProperty('scene_lang') ?: 'en_us'}"
            runDir('run')
        }
        netServer {
            server()
            name 'NetServer'
            runDir('run-net')
        }
        netClient {
            client()
            name 'NetClient'
            vmArg '-Dspartanweaponryarcana.netscene=true'
            programArgs '--quickPlayMultiplayer', 'localhost:25565', '--username', 'Dev'
            runDir('run')
        }
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/oblivioussp/spartanweaponryarcana/port/**'
}

// Production runs (tools/prodtest.sh): Minecraft with intermediary names, as players have it. The release jar on a
// real Fabric server; the scene on a production client from a jar that is the release jar plus port/ (so the code is
// checked against the intermediary names).
configurations {
    productionMods { transitive = false }
}
dependencies {
    productionMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    productionMods "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    productionMods files("${rootDir}/libs/spartanweaponry-fabric-${spartanweaponry_version}.jar")
}
var scenesJar = tasks.register('scenesJar', Jar) {
    from sourceSets.main.output
    archiveClassifier = 'scenes-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
var remapScenesJar = tasks.register('remapScenesJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = scenesJar.flatMap { it.archiveFile }
    archiveClassifier = 'scenes'
}
tasks.register('prodScene', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // setFrom: Loom adds remapJar by default, and of two jars with one mod id Fabric loads either
    mods.setFrom(remapScenesJar, configurations.productionMods)
    jvmArgs.add('-Dspartanweaponryarcana.scene=true')
    runDir = file('run-prod')
}
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.from(tasks.named('remapJar'), configurations.productionMods)
    runDir = file('run-prod-server')
}
