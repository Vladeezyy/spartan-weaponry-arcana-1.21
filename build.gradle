plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'SpartanWeaponryArcana-neoforge'
}

repositories {
    maven { url = 'https://maven.blamejared.com/' } // JEI, Patchouli
    maven { url = 'https://maven.theillusivec4.top/' } // Curios
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        // Scripted test scene (port/DevScene): world run/saves/swa_scene, run/screenshots/scene_*.png, then quits.
        scene {
            client()
            systemProperty 'spartanweaponryarcana.scene', 'true'
            systemProperty 'spartanweaponryarcana.scene.lang', project.findProperty('scene_lang') ?: 'en_us'
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Spartan Weaponry (required): its API and its weapon classes
    compileOnly files("libs/SpartanWeaponry-neoforge-${spartanweaponry_version}.jar")
    localRuntime files("libs/SpartanWeaponry-neoforge-${spartanweaponry_version}.jar")
    // Botania (optional, see gradle.properties): compiled against for compat/botania only; -Pwith_botania runs it
    compileOnly fileTree(dir: 'libs/botania', include: '*.jar')
    if (project.hasProperty('with_botania')) {
        localRuntime fileTree(dir: 'libs/botania', include: '*.jar')
        localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"
        localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    }
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            spartanweaponry_version_range: spartanweaponry_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { 'LICENSE_spartanweaponryarcana' } }
    // The test scenes (port/) are for dev runs only
    exclude 'com/oblivioussp/spartanweaponryarcana/port/**'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
