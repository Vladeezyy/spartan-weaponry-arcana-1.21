org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

parchment_minecraft=1.21.1
parchment_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
java_version=21
# NeoForm (vanilla Minecraft for the common project)
neo_form_version=1.21.1-20240808.144430
neo_version=21.1.262
# The oldest NeoForge the jar runs on
neo_version_range=[21.1.197,)

# Spartan Weaponry (required): the NeoForge 1.21.1 port, jar in libs/
# Spartan Weaponry (required): the multiloader build (libs/spartanweaponry-<loader>-*.jar)
spartanweaponry_version=3.2.1.1+1.21.1
spartanweaponry_version_range=[3.2.1.1,)
# Fabric (Botania 1.21.1 for Fabric needs Loader 0.17.3)
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.17.3
forgeconfigapiport_version=21.1.6
# Botania for Fabric in the dev runs (-Pwith_botania)
patchouli_fabric_version=1.21.1-92-FABRIC
trinkets_version=3.10.0
# Botania (optional): no 1.21.1 release yet; compiled against a build of its 1.21.1-porting branch (libs/botania/)
jei_version=19.64.0.454
# Botania's dependencies for -Pwith_botania
patchouli_version=1.21.1-92-NEOFORGE
curios_version=9.5.1+1.21.1

mod_id=spartanweaponryarcana
mod_name=Spartan Weaponry: Arcana
mod_license=GPL-3.0-or-later
mod_version=1.0.3
mod_group_id=com.oblivioussp.spartanweaponryarcana
mod_authors=ObliviousSpartan
mod_credits=Port to NeoForge and Fabric 1.21.1: Vladeezyy
mod_description=Official addon for Spartan Weaponry. Adds weapons made of Botania, Thaumcraft and Embers materials.

