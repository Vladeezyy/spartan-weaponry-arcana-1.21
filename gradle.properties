org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
java_version=21
# NeoForm (vanilla Minecraft for the common project); no Parchment for 1.21.11
neo_form_version=1.21.11-20251209.172050
neo_version=21.11.48
# The oldest NeoForge the jar runs on
neo_version_range=[21.11.48,)

# Spartan Weaponry (required): the multiloader build (libs/spartanweaponry-<loader>-*.jar)
spartanweaponry_version=3.2.1.2+1.21.11
spartanweaponry_version_range=[3.2.1.2,)
# Fabric
fabric_version=0.141.6+1.21.11
fabric_loader_version=0.19.5
forgeconfigapiport_version=21.11.1
jei_version=27.53.0.109
# Botania: no 1.21.11 version; the Botania materials' weapons are there, their recipes need Botania

mod_id=spartanweaponryarcana
mod_name=Spartan Weaponry: Arcana
mod_license=GPL-3.0-or-later
mod_version=1.0.3.1
mod_group_id=com.oblivioussp.spartanweaponryarcana
mod_authors=ObliviousSpartan
mod_credits=Port to NeoForge and Fabric 1.21.1 and 1.21.11: Vladeezyy
mod_description=Official addon for Spartan Weaponry. Adds weapons made of Botania, Thaumcraft and Embers materials.

# Compatibility runs (-Pwith_compat)
compat_sodium=mc1.21.11-0.8.14-neoforge
compat_iris=1.10.8+1.21.11-neoforge
compat_lithium=mc1.21.11-0.21.4-neoforge
compat_ferritecore=8.2.0-neoforge
compat_jade=21.1.7+neoforge
# Fabric compatibility runs (-Pwith_compat on :fabric:runScene)
compat_fabric_sodium=mc1.21.11-0.8.14-fabric
compat_fabric_iris=1.10.8+1.21.11-fabric
compat_fabric_lithium=mc1.21.11-0.21.4-fabric
compat_fabric_ferritecore=8.2.0-fabric
compat_fabric_jade=21.1.6+fabric
