org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 26.x: Gradle itself on JDK 25 (CI removes this line and sets up JDK 25)
org.gradle.java.home=/Users/vladeezy/.gradle/jdks/eclipse_adoptium-25-aarch64-os_x.2/jdk-25.0.4.1+1/Contents/Home

minecraft_version=26.3
minecraft_version_range=[26.3]
java_version=25
# NeoForm (vanilla Minecraft for the common project); 26.x has no obfuscation and no Parchment
neo_form_version=26.3-1
neo_version=26.3.0.95
# The oldest NeoForge the jar runs on
neo_version_range=[26.3.0.95,)

# Spartan Weaponry (required): the multiloader build (libs/spartanweaponry-<loader>-*.jar)
spartanweaponry_version=3.2.1.2+26.3
spartanweaponry_version_range=[3.2.1.2,)
# Fabric
fabric_version=0.165.0+26.3
fabric_loader_version=0.19.5
forgeconfigapiport_version=26.3.1
jei_version=31.16.0.86
# Botania: no 1.21.11, 26.1.2, 26.2 or 26.3 version; the Botania materials' weapons are there, their recipes need Botania

mod_id=spartanweaponryarcana
mod_name=Spartan Weaponry: Arcana
mod_license=GPL-3.0-or-later
mod_version=1.0.3.1
mod_group_id=com.oblivioussp.spartanweaponryarcana
mod_authors=ObliviousSpartan
mod_credits=Port to NeoForge and Fabric 1.21.1, 1.21.11, 26.1.2, 26.2 and 26.3: Vladeezyy
mod_description=Official addon for Spartan Weaponry. Adds weapons made of Botania, Thaumcraft and Embers materials.

# Compatibility runs (-Pwith_compat)
compat_sodium=mc26.3-0.9.3-beta.1-neoforge
compat_iris=1.11.7+26.3-neoforge
compat_lithium=mc26.3-0.26.2-neoforge
compat_ferritecore=9.0.0-neoforge
compat_jade=26.3.5+neoforge
# Fabric compatibility runs (-Pwith_compat on :fabric:runScene)
compat_fabric_sodium=mc26.3-0.9.3-beta.1-fabric
compat_fabric_iris=1.11.7+26.3-fabric
compat_fabric_lithium=mc26.3-0.26.2-fabric
compat_fabric_ferritecore=9.0.0-fabric
compat_fabric_jade=26.3.5+fabric
